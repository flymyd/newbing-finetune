[tasks.classify]
profile = "flymyd"
prompt = "prompts/classify.md"
max_output_tokens = 2048

[tasks.transcribe]
profile = "flymyd"
prompt = "prompts/transcribe.md"
max_output_tokens = 12288

[tasks.verify]
profile = "flymyd"
prompt = "prompts/verify.md"
max_output_tokens = 8192

[recovery]
max_output_tokens_ceiling = 24576
max_format_corrections = 1
max_incomplete_recovery = 1
# 恢复仍计入 pipeline 中同逻辑任务的总 HTTP 尝试上限。
