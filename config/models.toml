generate_content_path = "/v1beta/models/gemini-4-argon:generateContent"
stream_generate_content_path = "/v1beta/models/gemini-4-argon:streamGenerateContent?alt=sse"
model = "gemini-4-argon"
api_key_env = "NEWBING_API_KEY"
env_file = ".env.local"
protocol = "gemini_v1beta"
context_window_tokens = 500000
max_output_tokens = 65536
thinking_level = "high"
unlimited_budget = true
stream = true
sdk_max_retries = 0
connect_timeout_seconds = 30
