schema_version = 1

[profiles.flymyd]
base_url = "https://llm.flymyd.cn/v1"
responses_path = "/responses"
model = "gpt-6-luna"
api_key_env = "NEWBING_API_KEY"
env_file = ".env.local"
protocol = "responses"
# 历史 P0 能力记录；不构成本轮执行授权，本轮未复测。
capabilities_verified = true
vision_declared_by_user = true
structured_output = "probe_then_schema_or_validated_json"
stream = false
store_requested = false
sdk_max_retries = 0
connect_timeout_seconds = 15
request_timeout_seconds = 180
initial_concurrency = 2
max_concurrency = 6
max_probe_http_attempts = 12
max_input_images = 6
max_raw_image_bytes_per_request = 12582912
max_request_body_bytes = 20971520
image_detail = "high"

[profiles.qwen3_6_35b_a3b]
base_url = "https://llm.flymyd.cn/v1"
responses_path = "/responses"
model = "Qwen3.6-35B-A3B"
api_key_env = "NEWBING_API_KEY"
env_file = ".env.local"
protocol = "responses"
context_window_tokens = 256000
max_output_tokens = 32768
thinking_level = "high"
reasoning_effort = "high"
unlimited_budget = true
stream = true
store_requested = false
sdk_max_retries = 0
connect_timeout_seconds = 30
request_timeout_seconds = 360
initial_concurrency = 4
max_concurrency = 8
max_input_images = 0
max_raw_image_bytes_per_request = 0
max_request_body_bytes = 134217728
image_detail = "high"

